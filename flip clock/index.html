<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Flip Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main Component Container -->
  <main class="countdown-container">
    <div class="flip-clock" id="flipClock">
      
      <!-- Days Grid Unit -->
      <div class="flip-unit" data-unit="days">
        <div class="flip-card">
          <div class="card-face card-face--front">00</div>
          <div class="card-face card-face--back">00</div>
        </div>
        <span class="flip-label">Days</span>
      </div>

      <!-- Hours Grid Unit -->
      <div class="flip-unit" data-unit="hours">
        <div class="flip-card">
          <div class="card-face card-face--front">00</div>
          <div class="card-face card-face--back">00</div>
        </div>
        <span class="flip-label">Hours</span>
      </div>

      <!-- Minutes Grid Unit -->
      <div class="flip-unit" data-unit="minutes">
        <div class="flip-card">
          <div class="card-face card-face--front">00</div>
          <div class="card-face card-face--back">00</div>
        </div>
        <span class="flip-label">Minutes</span>
      </div>

      <!-- Seconds Grid Unit -->
      <div class="flip-unit" data-unit="seconds">
        <div class="flip-card">
          <div class="card-face card-face--front">00</div>
          <div class="card-face card-face--back">00</div>
        </div>
        <span class="flip-label">Seconds</span>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
